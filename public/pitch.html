<script>window.PITCH_DATA={"project":{"id":"folded-courtyard-her","title":"折叠庭院的她","format":"当代女性成长短剧 · 10集 · 单集约3—4分钟","logline":"一个始终被替换的替身演员，突然能够预见死亡并以自己的衰老换回生命；当一次救人让她被全网看见，她也被迫在名利、爱情与代价之间重新决定自己要成为什么样的人。","overview":["顾丽乔是影视城里最不起眼的群演和替身。她挨打、摔倒、讨要被压低的工资，收工后还要直播补贴生活。所有人都把她当作可以随时替换的小角色。","一次与陆文川的意外接触，让她看见他的死亡。预见逐步成真后，她放弃当天的钱冲入危险现场，并在陆文川死亡后的六十秒内将他救回。陆文川复活，顾丽乔却出现白发与衰老的代价。","救人视频把顾丽乔推上热搜。她第一次获得关注，也很快发现被看见不等于被认可。她借势争取真正的演员机会，同时与调查事故真相的陆文川相互试探、相互靠近。每一次救人都让她更接近自己想成为的人，也更接近身体无法承受的终点。"],"seasonEngine":"每次死亡预见都同时推动一场救援选择、一段身体代价和一次身份跃迁；顾丽乔越被世界看见，越必须决定是否继续用自己的生命换别人活下来。","updatedAt":"2026-09-11","status":"在线提报 · 团队协作"},"sources":[{"fileName":"《折叠庭院的她》故事大纲.docx","kind":"故事大纲","version":"v1","intakeDate":"2026-09-11","note":"Chapter 01完整展示"},{"fileName":"《折叠庭院的她》分集.docx","kind":"分集","version":"v1","intakeDate":"2026-09-11","note":"Chapter 02完整展示"},{"fileName":"《折叠庭院的她》第一集0911（丙）.docx","kind":"单集剧本","version":"v1","intakeDate":"2026-09-11","note":"作为当前第一集权威文本；0911视为日期标识，原文件无版本号，本次归档指定为v1。"}],"characters":[{"id":"gu-liqiao","name":"顾丽乔","role":"女主角 · 替身演员","bio":"影视城里长期被忽视的群演和替身，背负前夫留下的债务，也承受过婚姻暴力。她能忍、能扛，却并不甘心永远只是别人镜头里的背影。一次死亡预见让她冲进危险现场救回陆文川，也让她以白发和衰老为代价，第一次成为公众视线里的主角。","goal":"获得真正的演员机会，凭自己的能力被行业认可，并让生活摆脱债务和被控制的状态。","need":"确认自己的价值不来自流量、男人或施舍，而来自她主动做出的选择。","pressure":"每救活一个已经死亡的人，身体就会加速衰老；前夫、舆论和娱乐圈的利益交换不断逼她妥协。","arc":"从习惯忍受、等待别人给机会的替身，成长为会为自己争取、也能承担选择代价的真正演员。","visual":"当前资料明确第一集戏中戏为破损染血白色长裙、长发遮脸；救人后换回日常衣服，并出现一缕白发。脸、年龄、身形与日常造型待确认。","image":"","imageStatus":"待补概念图","status":"提报整理","source":"故事大纲、分集、第一集0911（丙）"},{"id":"lu-wenchuan","name":"陆文川","role":"男主角 · 光禾影业核心决策者","bio":"在公司内斗与东方庭院项目风险中保持克制的管理者。第一次出场时，他在视察中被顾丽乔预见将死，并在事故中被她救回。获救后他没有沉浸于热搜，而是追查缺失的原始监控，也把顾丽乔视为事故真相中最无法解释的变量。","goal":"查清东方庭院事故与公司内部破坏者，在限定时间内保住项目。","need":"从只相信利益与控制，转向尊重顾丽乔的选择，并承认自己真实的情感与秘密。","pressure":"事故可能并非意外，公司利益与顾丽乔的安全相互纠缠；季末揭示他也拥有异能。","arc":"从把关系当作可计算的交换，转向在关键时刻真正失去冷静，并为顾丽乔承担代价。","visual":"当前资料只明确他带助理、安全、法务和项目人员视察，医院醒来后仍保持判断与命令能力。年龄、脸、身形、发型和服装待确认。","image":"","imageStatus":"待补概念图","status":"提报整理","source":"故事大纲、分集、第一集0911（丙）"},{"id":"mary","name":"Mary","role":"女三 · 女明星 · 女主的职业镜像","bio":"有经验、有实力、熟悉行业规则的成熟女演员。她不是降智式反派，而是顾丽乔进入职业赛道后最直接的竞争者与镜子；她会维护自己的位置，也能识别真正的专业能力。","goal":"守住自己的职业位置与表演判断，不让流量事件轻易改写行业排序。","need":"从把顾丽乔视为突然闯入的资源变量，转向承认她作为演员的专业价值。","pressure":"顾丽乔的热度、救人光环与真实表演能力不断改变剧组原有的资源平衡。","arc":"从专业竞争与审视，走向对顾丽乔能力的正面承认；竞争关系保留，但不滑向脸谱化恶女。","visual":"当前只确定成熟女演员与职业镜像方向；年龄、脸、身形、发型与服装待确认。","image":"","imageStatus":"待补概念图","status":"提报整理","source":"分集"},{"id":"shen-nuo","name":"沈糯","role":"女二 · 女主闺蜜 · 后期助理","bio":"与顾丽乔共住群演酒店、一起维持直播的朋友。她会催顾丽乔准时开播，也会在看见伤口时立刻心疼追问，是顾丽乔最先拥有的日常支持系统。分集后段中，她进入顾丽乔的工作，成为助理。","goal":"帮助顾丽乔把突然到来的关注变成可持续的事业机会。","need":"从生活层面的陪伴者，成长为能在舆论与剧组压力中保护顾丽乔的职业伙伴。","pressure":"资源有限、工作混乱，也可能因保护顾丽乔而卷入项目阴谋。","arc":"从酒店直播搭档成长为顾丽乔可信赖的助理与证人。","visual":"第一集明确她在狭小酒店房间里敷面膜、调补光灯；年龄、脸、发型与服装待确认。","image":"","imageStatus":"待补概念图","status":"提报整理","source":"分集、第一集0911（丙）"},{"id":"ex-husband","name":"前夫","role":"现实压迫者 · 女主旧生活的控制力量","bio":"酗酒、赌博并把债务转嫁给顾丽乔，在婚姻中实施暴力。顾丽乔成名后，他又以所谓出轨和私密照片勒索，是她必须正面斩断的旧控制关系。","goal":"继续从顾丽乔身上获得钱，并用羞辱与暴力维持控制。","need":"无正向成长要求；其功能是让顾丽乔完成对旧生活的公开拒绝。","pressure":"顾丽乔逐渐获得公众关注和外部支持，他的威胁方式越来越难奏效。","arc":"从能让顾丽乔下意识防御的施暴者，变成被她明确拒绝并失去控制力的人。","visual":"第一集闪回明确满身酒气、夺手机、抡酒瓶；其他外形与服装待确认。","image":"","imageStatus":"待补概念图","status":"提报整理","source":"故事大纲、分集、第一集0911（丙）"},{"id":"aunt","name":"姑妈","role":"女主亲情支点","bio":"顾丽乔生活中稳定而具体的亲情来源。她的存在把顾丽乔的职业野心与真实生活连接起来，后期也因针对顾丽乔的暗杀而被卷入死亡风险。","goal":"让顾丽乔活得安全、稳定，不再被过去拖住。","need":"待后续独立人物小传补充。","pressure":"顾丽乔的事业、异能与外部阴谋逐渐侵入她的日常生活。","arc":"从生活后盾成为顾丽乔无法回避救人成本的最私人考验。","visual":"当前第一集成稿未出场；脸、年龄、职业细节、服装与生活空间待确认。","image":"","imageStatus":"待补概念图","status":"提报整理","source":"故事大纲、分集"},{"id":"chen-mo","name":"陈默","role":"幕后破坏者 · 项目内部反派","bio":"隐藏在项目现场和公司链条中的破坏者，为利益制造事故、舆论与拍摄危机。第一集预言只允许出现背影或局部，不能提前暴露身份。","goal":"按外部利益完成对东方庭院项目的破坏并逃避追查。","need":"无正向成长要求；其戏剧功能是迫使顾丽乔和陆文川形成共同调查线。","pressure":"顾丽乔的预见能力和陆文川对缺失监控的追查会不断缩小他的活动空间。","arc":"从不可辨认的背影逐步显形，最终被顾丽乔的假证据策略逼出反应。","visual":"第一集只能以迅速离开控制开关区域的背影或局部出现；完整外形待确认并应延后展示。","image":"","imageStatus":"待补概念图","status": ,{"name":"南院水巷","archetype":"影视城江南街区","rationale":"朴素、好拍、空间感明确，但品牌感较弱。"},{"name":"镜水长廊","archetype":"滨水沉浸式实景项目","rationale":"把镜面、水域与回廊三个关键视觉元素直接写进项目名。"},{"name":"江南十二景","archetype":"大型文旅影视街区","rationale":"带有真实商业项目的规模感，方便分区和多场景调度。"},{"name":"月汀里","archetype":"精品江南夜游街区","rationale":"三字品牌名更像当代文旅项目，适合夜景、水岸与偶像剧氛围。"},{"name":"浮光水院","archetype":"高端东方美学影棚","rationale":"“浮光”呼应异能光影，“水院”对应庭院与水灾核心装置。"}]}]},"episodes":[{"id":"ep01-v1","episode":1,"title":"这是第一次，被看见","version":"v1","sourceFile":"《折叠庭院的她》第一集0911（丙）.docx","intakeDate":"2026-09-11","duration":"3—4分钟","hook":"一场看似真实的家暴与怪物袭击突然被导演喊停，受害者只是片场里无人关心的替身。","core":"顾丽乔为了二十元风险钱被迫重拍，却在死亡预见成真后放弃当天的钱，冲进水灾现场，在陆文川死亡后的六十秒内将他救回；她第一次被全网看见，也第一次付出衰老的代价。","turn":"她从怀疑幻觉、准备继续工作，转为逆着所有人冲向危险，并第一次主动改变另一个人的死亡。","endingHook":"救人视频登上热搜一，顾丽乔的直播间从三百粉涌入十几万人；城市开始追问她是谁。","updateSummary":"首次归档0911丙稿。以水灾和乌篷船救援为当前第一集版本，建立7个阅读场次并保留原稿重复场号。","scenes":[{"id":"ep01-v1-sc01","sourceSceneNo":"1","displaySceneNo":1,"heading":"南庭影视城·复古教堂片场　日　内","location":"南庭影视城·复古教堂片场","time":"日","interiorExterior":"内","characters":["顾丽乔","怪物演员","前夫（闪回）","导演","制片主任","群头","陆文川","助理","视察人员"],"summary":"戏中戏的受虐画面与婚姻暴力闪回叠化，喊卡后揭示顾丽乔只是替身。剧组为重拍压价，她在愤怒和缺钱之间被迫接受。与陆文川手腕相触后，她看见东方庭院水灾与他的死亡。","script":"顾丽乔狼狈地被怪物按在破旧祭坛前，身上的白色长裙满是破损和血迹。她嘴角带血，长发遮住半张脸。\n怪物冲上前，一只手恶狠狠掐住她的脖子。\n【以下VO对话，建议只台词给，做旁白，不给对应的口型。做残忍打人的画面对切，加快节奏】\n前夫（VO）：拍这种照片，你是想勾引谁！\n顾丽乔看着怪物，眼前闪过几个极短的画面。\n前夫满身酒气，夺走她的手机；镜子撞裂；她的手臂挡在脸前，浑身是伤。\n顾丽乔（VO）：这是模特照，我是为了替你还赌债。\n前夫（VO）：替我？我的债就是你的债！\n前夫抡起酒瓶，就要朝她砸来。\n【叠化】\n现实中，怪物的手狠狠挥下。\n导演：卡！\n教堂顶灯亮起，怪物的手僵在半空。所有演员齐刷刷往镜头方向的导演看去，数十个片场工作人员穿着冬天的衣服，陆陆续续从阴影里走出来往导演方向聚过去，丧尸演员整理妆容、摘头套。\n导演：不行，这最后一下感觉不够。辛苦一下替身，再来一条，真撞啊！真撞。（对执行导演）把人脸遮一点，别穿帮。\n有人给丧尸演员递上衣服，丝毫没人关注冻得发抖的顾丽乔。\n群演头子：注意点，别把脸露出来。\n顾丽乔：通告里可说好的没有真撞。这要加两百风险钱。\n群演头子：就轻轻打一下，要得了两百？二十，这行就这样，能干干。不行，以后我这里的戏，你就别来了。\n顾丽乔的手微微攥紧，压抑着心中的愤怒，心跳也越来越快。\n群演头子：知道你缺钱，欠债，连房租都快付不起了。劝你，有一点，是一点。眼光也要放长远一点。\n片场入口忽然热闹起来，陆文川带着助理、安全、法务和项目人员走进来。导演、制片主任已经迎了上去。\n导演：陆总，您怎么亲自来了？\n顾丽乔被人群挤到景片边，差点摔倒，顾问穿下意识拉了她一把。两人的手腕相触，四周的声音骤然消失。\n【预言画面】临水回廊被冲出来的水淹没；警铃大响；墙上的电子钟停在12:17；一个人影迅速从控制开关的小路离开；陆文川淹死在水中，已经没了气息。\n【预言画面结束】\n顾丽乔猛地吸了一口气。\n顾丽乔：不要去东方庭院。\n陆文川：你什么意思。\n群头把顾丽乔拉回布景：开拍了！赶紧的。别动那种歪心思。\n顾丽乔再抬头时，陆文川已随视察队走远。"},{"id":"ep01-v1-sc02","sourceSceneNo":"2","displaySceneNo":2,"heading":"东方庭院·临水巷道　日　内","location":"东方庭院·临水巷道","time":"日","interiorExterior":"内","characters":["陆文川"],"summary":"陆文川独自进入东方庭院核查。机械装置启动，大量积水冲入临水巷道，乌篷船侧翻，他被掀进水里。","script":"东方庭院内部，陆文川独自走在现场，正中的湖边还停着一艘乌篷船。\n陆文川走到乌篷船边，小心翼翼地乘船想仔细查看。\n他刚踏上乌篷船，就听远处传来“咔”的一声，远处突然传来机械启动的声音。原本平静的水面突然开始剧烈涌动。\n下一秒，大量积水从旁边的楼体内部冲出。\n陆文川根本来不及反应，巨大的水流撞上乌篷船，船身猛地一歪。\n陆文川直接被掀进水里。"},{"id":"ep01-v1-sc03","sourceSceneNo":"3","displaySceneNo":3,"heading":"东方庭院外围候场区　日　外","location":"东方庭院外围候场区","time":"日","interiorExterior":"外","characters":["顾丽乔","群头","导演","群演"],"summary":"顾丽乔试图说服自己预言只是幻觉，但12:15之后警铃与落栓逐项成真。所有人催她回棚重拍，她却转身冲向东方庭院。","script":"顾丽乔坐在临河布景外等重拍，寒冬的夜冷得呼气都是白雾，她还沉浸在幻觉之中。\n顾丽乔：真是冻昏头了，那些怎么可能是真的。\n顾丽乔还是担忧地看着手机，已经到了12:15。\n群头：开拍了！都准备好！\n顾丽乔正要进棚，突然远处警铃骤响。\n月洞门“咔”地落栓。\n顾丽乔的表情严肃，带着惊恐。身后人群都涌了上来，导演也凑到前排。\n导演：哪儿出事了？东方庭院！快点，拍戏了。\n众人纷纷进入棚内，顾丽乔却有些犹疑，转身朝着东方庭院跑去。\n群头：诶！干嘛去！拍戏呢！"},{"id":"ep01-v1-sc04","sourceSceneNo":"4","displaySceneNo":4,"heading":"东方庭院·临水巷道　日　内","location":"东方庭院·临水巷道","time":"日","interiorExterior":"内","characters":["陆文川","顾丽乔"],"summary":"不会游泳的陆文川被水流撞击后失去意识。顾丽乔穿戏服跳入水中，手抵在他心口时能力发动，水流变慢、掌心发光，陆文川死而复生。两人爬上乌篷船，顾丽乔出现第一缕白发，而监控记录了全过程。","script":"陆文川被掀进水里，他不会游泳，落水的一瞬间下意识伸手想抓住船沿，却被水流狠狠冲开。\n他被水流带着撞向墙面，又撞上水中的房屋栏杆，挣扎着想浮出水面，却根本控制不住身体。\n他试图呼救，刚张嘴，水便灌了进去。缺氧让他的视线开始模糊。\n他最后一次抬头，看见的是被水流冲得不断摇晃的乌篷船。陆文川的身体渐渐失去力气，彻底失去意识。\n此时，一道白色身影跳入了水中。\n正是穿着戏服的顾丽乔。她朝陆文川游过去，一把抓住他的衣服，拍了拍他的脸，可人已经彻底失去了意识。\n水流不断冲击着两人四处摇晃，几乎要将两人冲散。顾丽乔伸手抓住他，手意外抵在了他的心口。\n周围突然安静下来，巨大的水声消失，所有声音全部停止，原本疯狂冲出的水流，在这一刻仿佛被按下暂停键，变得极其缓慢。\n顾丽乔看见自己的手心亮起一道光。似有一阵气流，以她的手掌为中心，一圈一圈荡开涟漪，水如同被惊动般荡漾出去。\n光继续向四周扩散。下一秒，所有光芒骤然收回，尽数进入陆文川的身体。\n陆文川猛地睁开眼睛，竟然活了过来，第一眼看到的就是近在咫尺的顾丽乔。\n顾丽乔回过神，立刻抓住他朝水面上乌篷船游去。两人终于抓住船沿，顾丽乔用尽力气，将陆文川托上乌篷船。\n两个人狼狈地趴在船里，大口喘气。\n顾丽乔躺在船上，已经力竭。她看了一眼自己的手心，没有异常的光亮。她也没注意到头发中有一缕已经变成白发。\n镜头慢慢拉远，一处不起眼的监控摄像头正对着这里。"},{"id":"ep01-v1-sc05","sourceSceneNo":"4","displaySceneNo":5,"heading":"影视城监控室　夜　内","location":"影视城监控室","time":"夜","interiorExterior":"内","characters":["监控外包负责人","神秘人（电话声）"],"summary":"监控外包负责人接到神秘电话，被要求剪掉线路和开关画面，却暂时保留顾丽乔救人的部分。事故从这一刻被人为改造成可利用的舆论素材。","script":"屏幕上的正是顾丽乔和陆文川躺在船上、力竭喘气的模样。\n监控外包负责人接起电话。\n神秘人（电话声）：线路、开关那几段，都剪掉。快点。\n监控外包负责人：那救人的呢？\n神秘人（电话声）：先留下。这是个机会。\n电话挂断。"},{"id":"ep01-v1-sc06","sourceSceneNo":"5","displaySceneNo":6,"heading":"医院病房　深夜　内","location":"医院病房","time":"深夜","interiorExterior":"内","characters":["陆文川","助理"],"summary":"陆文川醒来后第一时间寻找救命者。助理告诉他顾丽乔只是替身，救人视频已爆。原始监控被拷走且缺失数段，陆文川决定同时找到她并追查视频。","script":"陆文川睁开眼，监护仪恢复稳定节奏。助理守在床边。\n陆文川：救我出来的那个人在哪里？\n助理把手机递给他。\n助理：当场就走了，她是一个替身演员。现场登记只有名字，叫顾丽乔。\n手机上，是顾丽乔跳入水中救人，和陆文川躺在船上的剪辑视频。评论和转发飞快上涨。\n【评论：这俩人也太配了吧！】\n【评论：这碗饭我先吃为敬】\n【评论：都醒醒，这场意外就是因为两人剧组私会，还好没出意外】\n陆文川：去把原始监控留下。\n助理：事情发生后已经都拷走了，但有几段没了。\n陆文川抬眼看着助理。\n陆文川：先找到她。丢的那些视频的事，接着查。"},{"id":"ep01-v1-sc07","sourceSceneNo":"6","displaySceneNo":7,"heading":"群演酒店标间　深夜　内","location":"群演酒店标间","time":"深夜","interiorExterior":"内","characters":["顾丽乔","沈糯"],"summary":"顾丽乔带伤回到狭小酒店，仍坚持准时开播。她发现自己多了一缕白发，随后看见救人视频与直播数据同时爆发。面对十几万观众，她稳住声音完成自我介绍，城市则被有关她与陆文川的话题点燃。","script":"狭小房间里摆着许多衣服，空间非常狭窄。唯一一张较为宽阔的桌上架着两盏补光灯和手机。\n沈糯敷着面膜，正在调灯，听到门开，着急地催促着。\n门开，顾丽乔已经换回了自己的衣服，疲惫地走了进来。\n沈糯：你终于回来了，马上到时间直播了。三百粉也是粉，可不能迟到。\n等顾丽乔走近，沈糯才看见顾丽乔手臂上的擦伤，立刻摘下面膜，很是心疼。\n沈糯：怎么又受伤了？又让你拍危险的戏份了？给钱了吗？\n顾丽乔：不是拍戏伤的。\n顾丽乔没再多说。她坐到灯前，简单整理就打开了直播，却看见镜子里自己多了一缕白发，她对此很困惑。\n沈糯的手机震动了一下，她打开手机一看，惊呼一声。\n沈糯：小乔，这是不是你？\n顾丽乔看见手机中的正是救人的视频。同时，她看见直播界面上许多人在刷嘉年华等礼物，评论不断翻滚着。\n【评论：是这姐吧！这姐真敢冲。】\n【评论：那视频是不是摆拍啊？一个替身怎么会提前知道里面有人？】\n【评论：才三百粉？？？】\n【评论：老婆！老婆太帅了！】\n【评论：姐姐，你救人的样子，比剧里的女主角还像女主角！必须给我红！】\n顾丽乔看着屏幕上，观看人数已经高达十几万，不敢相信。\n沈糯把手机转向顾丽乔，微博界面上“替身女演员勇救光禾影业少爷”已经上了热搜一。\n沈糯：这，还播吗？\n顾丽乔：播。\n顾丽乔（对手机）：大家好，我是顾丽乔。今天下戏有点晚……\n她的声音很稳，桌下的手却在发抖。镜头外，直播的观看数字还在继续攀升。\n深夜的城市全貌，上空不断漂浮着话题：#顾丽乔是谁#、#光禾影业股价大涨#、#替身X少爷文学#、#顾丽乔替身演员#、#美救英雄#、#东方庭院意外#……\n深夜的城市，沸腾着。"}],"continuity":["顾丽乔从戏中戏破损染血白裙切换到日常服装；手臂增加擦伤，头发新增一缕白发。","陆文川落水后经历湿透、无意识、复苏、医院苏醒四个连续状态。","同一艘乌篷船、临水巷道水位与监控机位需要跨第2、4、5阅读场次保持一致。","顾丽乔与陆文川第一次相触触发死亡预见；第二次心口接触触发复活能力。"],"issues":["故事大纲与分集的第一集写“火灾／陆文林”，0911丙稿写“水灾／陆文川”；本H5暂以0911丙稿为当前单集权威文本，但项目总纲是否同步改为水灾与陆文川需确认。","原稿第4场之后的监控室仍标为“4.”，本H5保留原场号4并用阅读顺序5展示，正式稿需统一场号。","第3场场头标“日 外”，正文写“寒冬的夜”，日夜设定冲突需确认。","第1场“顾问穿下意识拉了她一把”疑为姓名输入错误，结合上下文可能指陆文川，但未擅自改写。","当前三份文件没有独立人物小传；本页人物小传由故事大纲、分集与第一集提报整理，年龄、脸与完整造型均未锁定。"],"status":"提报整理"}],"chapters":{"storyOutline":["顾丽乔一直是剧组里最不起眼的群演。她每天在片场等戏，挨打、摔倒、跑龙套，收工后还要为本就不高的工资讨价还价。没有人在乎她是谁，也没有人在乎她到底想不想成为一个真正的演员。对所有人来说，她只是随时可以被替换的一个小角色。","直到那一天，她在东方庭院的拍摄现场遇到了陆文川。","两人擦肩而过的一瞬间，顾丽乔突然看见了一个陌生却无比真实的画面——陆文川被困在火场之中，四周燃起大火，他最终倒在浓烟里，再也没有起来。顾丽乔以为自己只是出现了幻觉。可很快，现实开始一点点与她看到的画面重合。","陆文川正在东方庭院核查工程安全，却意外被锁在建筑内部。火灾突然发生，他想办法逃离，却最终迷失在浓烟之中。所有人都在向外逃，只有顾丽乔冲进了火场。她找到已经失去生命体征的陆文川，拼命为他做心肺复苏。当她的手触碰到陆文川心脏的一瞬间，一道异常的光影闪过。","陆文川重新有了心跳，而顾丽乔的头发，却多出了一缕白色。","顾丽乔不知道发生了什么，只知道，从那一刻开始，自己似乎能够看见一个人的死亡。可她不知道，救活一个已经死亡的人，需要付出自己的代价。","陆文川获救的消息迅速登上热搜。顾丽乔救人的视频被传播开来，她第一次成为公众视线中的人。过去无人问津的直播间突然涌入大量观众，各种关于她和陆文川的传闻也随之出现——有人说他们本来就是情侣，有人说这场火灾是为了捧红顾丽乔而设计的意外，甚至有人开始挖掘火灾背后的真相。","陆文川却没有沉浸在舆论之中。他开始调查谣言的来源。这场谣言对东方庭院的开拍有致命的影响，陆文川也开始怀疑那场火灾并非意外。","与此同时，他把目光放到了顾丽乔身上。她为什么会提前知道那里会出事？","当陆文川单独找到顾丽乔时，他直接问她是否与火灾有关。顾丽乔无法解释自己的能力，只能谎称自己当时只是有一种特殊的感觉。自小就在商业斗争中游走的陆文川并不相信，只以为她是要钱。陆文川提出可以给她一笔钱，既作为救命的感谢，也作为让她说出真相的交换。顾丽乔拒绝了。","救人的视频让顾丽乔短暂地获得了关注。剧组里曾经欺负她的人开始对她客气，化妆师认真给她化妆，群头不再随意训斥她，还有采访、活动和角色主动找上门。但很快她发现，被看见并不等于被认可。","采访者表面上说只想了解火灾真相，真正的问题却是希望她暗示自己和陆文川存在暧昧关系。她拒绝配合，认真回答问题，却被节目剪辑成了另一种样子。","她开始有了一点热度，也开始能够参加圈内饭局。可那些人需要的只是她身上的流量。拍照时大家会把她拉进来，照片拍完，她就重新被丢在一边。她主动向导演介绍自己，得到的也不过是一句可以给她一个小角色露脸。甚至还有人当众对她说黄色笑话。","顾丽乔没有立刻反抗。但她第一次真正下定决心——她不能一直这样活下去。","很快，热度退去。","没有了陆文川事件带来的关注，顾丽乔重新回到原来的位置。就在她以为一切都会重新归于平静的时候，前夫突然闯入她家，以她“出轨陆文川”为借口索要钱财，还拿她的私密照片威胁她。","过去的顾丽乔或许会害怕。现在的她却没有退让。","这段时间的商业活动和反馈，让她看见了更为开阔的世界，也明确自己的价值，知道自己不应该因为过去的婚姻而任由别人控制。她与前夫正面冲突时，陆文川及时出现，阻止了前夫继续动手。","这一次的出手相助，让顾丽乔对这个傲慢的陆文川有所改观，她也向陆文川透露了更多真相。她虽然不知道火灾究竟是谁策划的，但曾经看到过一个鬼鬼祟祟的身影，有一些细节。","陆文川让人去调查的同时，也告诉顾丽乔，自己所在的公司正处于关键时期。东方庭院项目关系到公司的利益，如果内部斗争和项目问题曝光，可能会影响整个公司。他希望顾丽乔保守秘密，甚至再次提出金钱作为交换。","顾丽乔拒绝了。她不愿意卷入陆文川的公司斗争，也不愿意因为钱而被别人控制。她只是不想惹麻烦。","陆文川却因此对她产生了新的兴趣。这个女人明明缺钱、缺资源，也一直想要进入娱乐圈，却没有趁机向自己索取更多，不知道是不够聪明，还是太聪明。于是他把自己的名片交给她，告诉她，如果以后有需要，可以来找自己。","不久，两人在一场饭局再次碰面。","顾丽乔仍在努力寻找进入真正剧组的机会。饭局结束后，她准备自己离开，陆文川却主动开车送她。他看出了她在这个圈子里的困境，于是给了她一个直接而现实的建议。如果和自己传出一点暧昧关系，至少别人不会轻易欺负她。","顾丽乔不愿意承认自己需要依靠陆文川。陆文川却告诉她，成年人做事情首先考虑的是利益最大化。既然有一块可以借力的石头，为什么不用？顾丽乔思考很久，最后没有选择向他要钱，也没有选择让他直接替自己安排角色。她只提出一个要求，她想要《东方庭院》的试镜机会。","她知道，真正被送到自己手里的东西未必能够守得住。她要的不是一个别人施舍的角色，而是一张能够进入这个圈子的入场券。","陆文川答应了，并加了她的联系方式。","东方庭院开始试镜。顾丽乔想争取女二的角色。角色是侠女，需要大量武打戏。为了这次机会，她推掉了其他工作，开始拼命训练。她身上一次次出现淤青，却没有拿这些伤去博取同情。她知道自己只有这一次机会。","另一边，陆文川也开始在公司内部处理东方庭院项目的问题。","顾丽乔因为他的关系，第一次体会到了别人对自己的客气。她渐渐学会在酒局和各种复杂场合保护自己，也学会借用陆文川带来的影响力。可就在她一步步向演员身份靠近时，异能再次出现。","被陆文川顺路送回家的路上，顾丽乔因为意外导致心率突然加快。她看见了邻家妹妹死亡的画面。顾丽乔找到邻家妹妹，却发现对方不在家，也联系不上。","顾丽乔根据自己看到的画面，猜出了事故发生的地点。她赶到现场，亲眼看见邻家妹妹遭遇车祸。她再次冲过去救人，人活了下来，顾丽乔却因为透支而昏倒。","陆文川恰好看见了她头发上新出现的一撮白发，这让他终于确定，顾丽乔身上隐藏着某种无法解释的秘密。","试镜当天，顾丽乔刚刚醒来，却已经发现自己的身体出现了明显变化。她意识到，自己每救活一个已经死亡的人，身体都会加速衰老。并且回忆起当时智能手表的心率提示，猜到了异能触发的关键——心率。","顾丽乔还是拖着病体去参加试镜。这一次，她面对的不再是普通的竞争者，而是有名气、有资源、有经纪团队的演员。甚至有一个女演员正是顾丽乔一直希望自己成为的样子。轮到顾丽乔时，因为工作人员得知她只是一个网红，甚至不愿意让她试镜。她坚持为自己争取了一次机会。最终，她的表演让现场的人改变了看法。可即便如此，她还是被暂时放在了“待定”位置。","陆文川告诉她，她演得很好，只是娱乐行业有自己的商业逻辑。剧组不仅需要演员实力，还需要能够承担播放量和市场关注度的人。顾丽乔第一次真正感受到自己的差距。她想成为一个演员，她想靠自己的能力被看见。可最后需要先被看见，才能成为演员。","陆文川告诉她，事情最终确定之前，一切仍然有改变的机会。他也向顾丽乔坦白——他已经知道了她拥有异能的秘密。顾丽乔选择相信他。她告诉陆文川，自己是突然之间能够预见死亡，猜测是因为心率而触发，并且会得到衰老的代价。","经历了接连两次救人之后，顾丽乔做出了一个决定。她以后不会再用自己的生命去救别人。而异能带来的困扰之外，现实也仍在步步紧逼。","顾丽乔参加综艺，花钱准备妆造，在节目里努力表现。她甚至拉着姑妈一起看节目，以为自己终于能够让姑妈看到自己的成绩。节目播出后，她才发现自己的镜头几乎被全部剪掉。姑妈依旧很高兴。顾丽乔却第一次感到失落。","她发现，自己仍旧无法改变自己的生活。她想要的是一个稳定的身份，是能够凭自己的能力给姑妈更好的生活，而不是一次次靠奇迹换取短暂的热度。","于是，她开始主动改变自己的生存方式。她参加饭局，主动认识制片人和导演，参加更多综艺，在各种活动中争取露脸机会。她不再幻想有人会主动发现自己。她开始主动创造机会。","一次活动中，她免费的客串表演再次获得关注。这一次，她没有把热度当成偶然，而是主动找到宣传公司的老板，提出自己愿意花钱购买宣传机会。她告诉对方，自己已经试镜了《东方庭院》，想再搏一次。宣传公司老板答应帮助她，并看好她的发展。","顾丽乔再次登上热搜。并被宣传公司借着和前夫的过去建立起一个强势、独立的公众形象，终于让自己被更多人记住。可热度带来的从来不只有机会。有人骂她买热搜，有人说她靠关系，甚至有人直接认定她是靠陆文川拿到角色。","但就在舆论争议最大的时刻，《东方庭院》的内部选角会议做出了决定。","顾丽乔最终获得了女二的角色。她拿到了自己拼命争取的入场券。","然而真正进入剧组之后，她才发现，自己需要面对的竞争远比试镜更加残酷。","女主拥有自己的房车和完整团队，而顾丽乔只能坐在监视器后面等待。她每天准时到场，却经常需要长时间等待。属于她的戏份会被临时删掉，台词也会被修改。","她带着水果和饮料参加定妆，却被女主经纪人暗暗嘲讽。当女主完成定妆后，对方甚至要求她给女主让妆。顾丽乔没有闹，她选择暂时忍下来。","因为她终于知道，自己真正想要的是把戏演完，只想要有机会被更多人看见。她开始用自己的表演说话。她的片场路透逐渐受到关注，甚至让女主演感到了压力。制片人注意到了她的能力，开始要求导演给她更多戏份。","她终于开始一点点从“一个有热度的网红”变成“一个真正有存在感的演员”。","这段时间，陆文川也逐渐成为她身边一个特殊的存在。","天气寒冷，他来到片场探班。看到剧组条件不好，他给群演安排加餐，也默默照顾顾丽乔。顾丽乔面对别人的关心，总习惯说“没关系，我没事”。陆文川没有追问，没有当真，他只是直接把该准备的东西准备好。如果她不用，那就不用。这种不需要她解释的照顾，让顾丽乔第一次产生了安全感。","两个人开始越来越自然地待在一起。他们没有真正说破关系，却已经在彼此的生活里留下了位置。","直到一次拍摄事故，顾丽乔在水戏中濒临死亡。就在死亡逼近的时候，她再次看见了预言。这一次，她看到的是自己的死亡。而在自己死亡的画面里，她看见了陆文川。他站在旁边，冷静地和下属交代事情，仿佛完全不在意她的死亡。顾丽乔无法接受这个画面，她开始刻意躲着陆文川。","陆文川察觉到她的疏离，特意留下来等她。顾丽乔却告诉他，他们最好还是保持距离。","顾丽乔每天拍戏到几乎耗尽体力，回到酒店甚至会直接睡着，第二天醒来后，一边刷牙一边背新剧本。她的生活开始越来越忙。但这种忙碌也终于换来了真正的回报。","拿到新的演员费用后，她给姑妈换了新的店铺，也开始正式给自己的闺蜜兼助理发工资。她没有忘记自己为什么要拼命往前走。她想让姑妈过得更好，也想让曾经陪着自己的人能够跟着她一起过得更好。","就在顾丽乔逐渐站稳脚跟的时候，《东方庭院》剧组突然爆出丑闻。","有人拍到导演和演员之间存在不正当关系，娱乐新闻迅速发酵。更重要的是，拍摄这些照片、试图让剧组陷入危机的神秘人，正是之前曾经出现在顾丽乔预言中的那个人。（仅观众可知）","陆文川开始调查消息来源。与此同时，顾丽乔也受到牵连。","一张她开拍前给导演送东西的照片被曝光，有人据此暗示她和导演之间存在关系。制片人因此产生了换掉她的想法。陆文川却第一次公开站到她这一边。","他相信顾丽乔，也不允许公司在没有确认事实之前，就因为一条娱乐新闻毁掉一个演员的职业生涯。","顾丽乔的助理怀疑是女主演为了撇清而故意泼脏水。因为她们曾经见过女主演从导演房间里出来。但顾丽乔让闺蜜这种话尽量别讲，她不愿意在没有证据的情况下，把另一个女人推入舆论。这句话恰好被女主演听见。原本看不上顾丽乔的女主演，对她产生了新的改观。","第二天，真相被曝光。真正涉及丑闻的是导演和一个小男演员。两人被剧组直接替换。事情终于得到解决。","顾丽乔知道这一切是陆文川在背后帮了自己，她去找他道谢。这一次，陆文川没有继续隐藏自己的感情。他向顾丽乔表白。顾丽乔心动了，可她不敢接受。她告诉陆文川自己看见的预言，陆文川却没有因此退缩。","他告诉她，她看到的预言并不完整，也许她看到的只是某一种可能。他愿意给她一个证明自己的机会。也会竭尽全力救下顾丽乔。","顾丽乔终于动摇，要吻上他时心跳狂飙。就在此刻，她再次看见了陆文川的死亡。而且就在不久之后。","顾丽乔根据预言中的环境、道具和拍摄内容判断死亡发生的时间和地点。她发现，危险很可能发生在两天后的剧组现场。她告诉陆文川这两天不要来剧组。陆文川暂时听从了她。","时间过去一天，什么都没有发生。顾丽乔以为自己已经改变了命运。可因为拍摄问题，那几场戏需要重拍，陆文川又因为其他事情来到现场。意外最终还是发生。顾丽乔提前救下了陆文川。但与此同时，她也彻底暴露在幕后之人的视线里。","陆文川意识到顾丽乔继续留在剧组，会非常危险。为了保护她，他直接联系剧组，要求删除顾丽乔的戏份，让她退出拍摄。得知此事的顾丽乔却无法接受。她拼命争取来的角色，终于走到今天，她不愿意因为陆文川的一句“为了你好”就放弃。","两人第一次真正发生争吵。陆文川认为自己是在保护她。顾丽乔却认为，他根本没有问过自己想要什么。两个人不欢而散。","不久之后，真正的危险找上了顾丽乔。她在拍戏回程的路上遭遇车辆暗杀。","姑妈因为晚收摊而发现异常，为了救她，被车撞死。顾丽乔彻底崩溃。她看着自己最亲近的人死去，却再次做出了那个自己曾经发誓不再做的选择。","她救活了姑妈，而她自己也因此付出了更加严重的代价。身体已经虚弱到无法正常拍摄。","陆文川来看她。这一次，他没有替她做决定。顾丽乔却主动告诉他，她暂时确实已经无法继续拍摄，希望剧组把剩余戏份往后安排，可她还是想拍完。因为这部戏不仅关系到她自己的演员身份，也关系到整个剧组。她知道项目必须在规定时间内完成。即使自己已经撑不住，她仍然不愿意因为自己的原因让所有人的努力前功尽弃。","就在这个时候，闺蜜助理发现，发布的Vlog意外拍到了那个神秘人。陆文川从视频中发现，这个人和顾丽乔之前看到的身影非常一致。更让他在意的是，这个身影，他似乎在哪里见过。","陆文川并没发现，这个神秘人正是公司的二把手陈默。他暗中与另一家公司联系，准备破坏《东方庭院》，并从中获得利益。他并不是为了什么复杂的复仇，也没有更宏大的目的，他只是为了钱。而《东方庭院》最后一次拍摄，成为了他真正准备动手的机会。","此时的顾丽乔已经严重衰老。化妆师在给她化妆的时候，也发现了她身体上的异常。她的体力几乎已经到了极限。可当天要拍的依然是一场重要的打戏。顾丽乔坚持完成，这一次，她真正沉浸在了表演之中。她第一次感受到，自己不再只是那个拼命想让别人看见的群演，她正在成为一个真正的演员。","就在她心率再次飙升的时候，死亡预言再次出现。这一次，她看见的是东方庭院的大火。整个片场都陷入危险。群演、工作人员、主演和她身边的人，全都可能死在这场火灾里。而她自己，也会死在这里。","顾丽乔立刻意识到，预言中的时间到了。","她和身边的人一起研究东方庭院的环境与当天通告，最终确认——这不是未来的某个场景，而是当天B组正在拍摄的戏。陆文川与顾丽乔赶往B组现场。他们要求立刻取消拍摄。","可是现场所有设备、群演和工作人员都已经准备就绪，剧组无法理解他们为什么突然要求停工。他们又无法解释自己为什么知道这里会发生火灾。","陈默就在现场。听到他们要求停拍之后，他表面上配合，心里却已经慌乱。","顾丽乔终于开口，她告诉所有人，有人准备蓄意纵火，而且自己已经拿到了监控证据，知道对方准备在哪里动手。她说证据视频她已经拿到了，现在当务之急是要撤离所有人。","然而下一秒，火苗真正窜了起来。现场彻底失控。陈默只能装作紧张，催促大家赶紧救人。","陆文川和顾丽乔带着人开始疏散。顾丽乔突然想起自己在预言中看到的另一个着火地点。如果火势蔓延过去，会造成更大的伤亡。陈默听到了她的话，悄悄跟在独自离开的顾丽乔身后。他害怕顾丽乔手中的证据，怕成为自己定罪的证据。","便准备趁混乱杀掉顾丽乔。","可就在他准备动手的时候，陆文川突然出现，将陈默直接击倒。直到这一刻，陈默才明白自己中了圈套。顾丽乔根本没有所谓的监控证据。她只是故意说出这些话，逼幕后的人露出反应。","但火灾已经发生，危险并没有因为陈默被抓住而结束。","建筑内部仍然有人受伤，有人甚至被倒塌的东西砸死。顾丽乔看见其中一个死去的人，正是曾经和她一起做群演、也曾经帮助过她的人。她明明已经没有力气，她明明知道自己再救人，身体会继续衰老，可她还是冲了进去。","她救出了一个人，又救出第二个人。直到身体彻底支撑不住，顾丽乔倒下。","陆文川看到她昏迷的瞬间，第一次真正失去了冷静，冲过去将她抱住。陆文川的助理赶来，陆文川冷静地交代着什么。这一幕和顾丽乔看见的一模一样。可陆文川却吻上了她，说：我绝不会让你死。","这场火灾最终结束。《东方庭院》也在之后取得了成功。剧组获得了荣誉，顾丽乔凭借女二这个角色获得了最佳女二。她终于成为了自己一直想成为的演员。她不再是片场里那个没人认识、没人愿意多看一眼的群演。","她被真正看见了。","然而故事并没有按照顾丽乔想象的方式结束。颁奖礼后台，她和陆文川再次见面。可两人似乎并不认识。","顾丽乔觉得陆文川很亲切，周围的人告诉她，他们两个人之间从来没有私下的交集。顾丽乔转身离开。直到顾丽乔的身影离开之后，陆文川才转过头来，眼中满是不舍与悲痛，他的指尖突然亮起一道光。原来，他也拥有某种异能。死而复生显然就是他导致的。","而顾丽乔和陆文川之间，或许还会有故事发生。"],"episodeGuide":[{"episode":1,"title":"第一集","paragraphs":["顾丽乔在剧组拍摄，被丧尸殴打，极其惨。导演喊咔，才发现其实是在拍摄现场。结束后无人在意她，收工要工资时还被压价。顾丽乔要债不成，与来探查的陆文林擦过。顾丽乔的脑海中出现陆文林惨死火中的景象，而事情发生的背景正是他们的拍摄地——东方庭院。顾丽乔以为是幻觉，可周围的景象越来越相似。","陆文林去核查工程安全，却被锁在其中。火灾突发，陆文林设法逃走，却难以脱身，最终迷失在烟雾中，已经身亡，彻底失去生命体征。外围所有人都在躲离危险区域，顾丽乔却冲了进去，她给陆文林做心肺复苏，手触碰上心脏的一瞬间，有光影浮动，陆文林复活。顾丽乔头发多了一抹老化的白色。","顾丽乔回到家却觉得分外疲惫，但还是坚持要直播，却发现突然涌入了很多人。热搜不断攀升，顾丽乔美救富豪的视频成为大热点。顾丽乔的直播中也涌入许多人。原本寂静无声的世界，因为被看见而沸腾起来。"]},{"episode":2,"title":"第二集","paragraphs":["热搜不断沸腾，有人编撰二人的感情故事，有人探寻火灾背后的真相。一个谣言甚嚣尘上——陆文林和顾丽乔早是情侣关系，这是为了捧她而进行的拍摄，导致的意外。陆文林得知此事，让人去调查传出谣言的幕后推手，并因为诸多巧合，开始怀疑火灾的背后是有人要对自己动手。","陆文林来见她。陆文林和顾丽乔单独对话，他怀疑顾丽乔和火灾有关，否则为什么知道会出问题。顾丽乔无法解释，就谎称是感觉。陆文林并不信任顾丽乔，表示愿意给钱，作为感谢费，也希望顾丽乔能说实话。顾丽乔对于自己被怀疑很气愤，并拒绝了所谓的感谢费。","顾丽乔因为救人的视频获得关注，得到许多联系邀约。剧组的人对她的态度也有了极大的转变，化妆师专门给她认真画，欺负她的群头态度也缓和许多。","甚至有人主动邀约进行采访。可采访者说好只问事实，却在采访时希望顾丽乔能暗示自己和陆文林有关系。顾丽乔拒绝，并认真回答。","顾丽乔这段时间出席很多活动，获得小的角色，个人自媒体拍摄的短片也爆火，事业有所起色。","圈子里的聚餐她也能参加，却总是在拍照后被众人冷落，众人只是想要借她的名气，却没有人真的能看见她。","聚餐当场，顾丽乔的采访播出，对方却将她的行为乱剪辑，制造出两人暧昧的表述。陆文林方面却进行了澄清。众人嘲讽顾丽乔被嫌弃等话。","顾丽乔主动向导演介绍自己，却也只获得说可以给个小角色露露脸，甚至有人对她开黄腔。顾丽乔表面隐忍，却发誓一定要改变这一切。【本段一组镜头快做，过渡时间】"]},{"episode":3,"title":"第三集","paragraphs":["热度很快消退。也没有其他的戏敢找她。欠债还完，再次要回到以前寂寂无名的时刻。","前夫闯入顾丽乔的家，斥责顾丽乔出轨陆文林，要挟要换取钱财，否则发顾丽乔的裸照。顾丽乔却不似以往，经历了这么多事的她，明确地知道自己的价值所在，和前夫硬刚。陆文林来找顾丽乔，及时制止前夫要殴打的行为，严肃警告（要帅）。","顾丽乔告知陆文林那天她虽然不知道下手的人是谁，但她有看到一个鬼鬼祟祟的身影出现在周围（预知死亡时看见的一闪而过的画面）。陆文林派人去查监控。陆文林告知自己家的公司现在正式关键时刻，需要稳定，他希望顾丽乔保密公司内斗的消息，还拿来了钱。并威胁如果不答应，也可以让顾丽乔无法继续演戏。顾丽乔不吃这一套，表明自己只是不想牵扯进去。","顾丽乔的态度，引起了陆文林的好奇。他给出自己的名片，表示如果有需要，可以来找他。","陆文林被邀请参加饭局，却在饭局上遇到顾丽乔。顾丽乔还在努力向导演争取。酒会结束后，顾丽乔要自己回去，陆文林却主动停车要载她离开。陆文林照顾顾丽乔，对她的固执有好感。他提出她可以谎称和自己暧昧，这样会少被刁难，圈子里的人一般也不会直接问。顾丽乔有些不认输，陆文林却说成年人要的是利益最大化，有垫脚石可以踩，为什么不用呢？顾丽乔因为之前频繁受挫，思考过后，提出要求一个试镜东方庭院角色的机会。陆文林说她可以要更多，但顾丽乔有自己的理解，能直接要到的未必守得住，她只需要一个入场券，被正视的入场券。","东方庭院即将开始试镜。顾丽乔想试女主和女二的角色，但角色是侠女，武打戏居多。顾丽乔为此推掉了许多工作，专心筹备，也向姑妈道歉，她准备背水一战，一旦赢了就有可能获得翻倍的钱。她身上全是淤青，却没有开口卖惨。陆文林邀请顾丽乔参加公司年会，因为有陆文林在，所有人对她都很客气。","顾丽乔被陆文林开车载回家，她已经能够在酒肉的场合熟练地狐假虎威。可路上有行人闯红灯，她心率飙升，因此意外看见邻家妹妹死亡的画面。顾丽乔尝试去找邻家妹妹，却发现打电话不接，人不在家。顾丽乔让陆文林载自己去找人，但又难以解释自己看到的画面。终于顾丽乔根据记忆中的画面猜到了事情发生的地点，却亲眼目睹邻家妹妹出车祸的瞬间，顾丽乔去救人，将人救活。陆文林刚好看见她的头发变白了一撮。顾丽乔救人后却昏了过去。"]},{"episode":4,"title":"第四集","paragraphs":["试镜已经开始，刚苏醒的顾丽乔已经发现自己的白发。意识到自己一旦久了死去的人，就会加速衰老。但她还是拖着病体来试镜。","陆文林是评委之一。来的人有非常有名的艺人，工作人员全程对接。有的艺人演得差，却因为名气而被捧臭脚。有的人压根不来。还有一个女演员很厉害，是顾丽乔理想中的样子。顾丽乔听到里面的鼓掌声而感到紧张。顾丽乔进去试镜，却被看到是网红后，就被要求不用试镜了。顾丽乔坚持为自己要一个机会，她的表演令人惊艳。却还是因为偏见而被待定。","之后，陆文林找到顾丽乔，告知她演得好，武打戏虽然没有vlog里的好，但是还是落选了。剧的商业逻辑，就是需要能抗住剧播放量的人，有人关注的人。","顾丽乔知道，只希望能有角色就好，她就是想当一个能被看见的演员，可现在还是失败了。陆文林说事情定下之前，还有改变的机会。","陆文林坦白告知已经知道顾丽乔的异能秘密。顾丽乔信任，告知陆文林，她能预见死亡。可触发异能的原因不知道。顾丽乔决定再也不用自己的生命救人。","有综艺节目找上顾丽乔，她自己花钱请妆造，做足了准备，节目过程也很努力，却在拉着姑妈看的时候，发现自己被剪得几乎什么都没剩。姑妈很高兴，顾丽乔却不这样想。她这样永远也无法成为能给姑妈稳定生活的人。她觉得自己的异能没有作用。","顾丽乔主动参加饭局，喝酒，赔笑。去讨好制片人和导演。在主演面前露脸，多参加很多综艺节目。在一场活动里她客串表演，再次爆火，拥有热度和关注。顾丽乔主动找到饭局上也在的公关宣传公司的老板，愿意花钱让她帮自己买热搜，说试镜了东方庭院，需要热度再搏一把。宣传的老板答应，并对她很有好感，买股了她。","顾丽乔冲上热搜，搏了眼熟，还利用前夫的过去，立大女主人设。"]},{"episode":5,"title":"第五集","paragraphs":["红伴随而来的就是黑。有人怒骂顾丽乔买热搜，靠关系。陆文川公司的内部选角会议，众人都选择了顾丽乔。但同时，陆文川被告知半年内拍不完这部剧，这块地就不属于他们公司了。所有人尽全力推进剧组拍摄。（本集，顾丽乔好友出场，担任顾丽乔的助理）","顾丽乔获得女二的角色，得到消息时喜出望外。定妆时她带了水果和饮料，却被主演经纪人暗暗阴阳，觉得她是靠陆总上来的。并且觉得她越权，请的东西不入流，且没有分寸，敢在主演请客之前请。很快，主演定妆，所有人都围着女主。经纪人看到定妆照后，要求顾丽乔为女主让妆。顾丽乔选择忍耐。","开机仪式后，戏正式开始。主演有房车，顾丽乔却只能坐在监视器后。每天按点到却需要等很久。戏还会被临时删掉，或者改台词。可顾丽乔没有办法，只能在属于她的戏份中尽力而为。顾丽乔的拍摄路透出圈，惹得女主生气。","制片人看见了她的能力，让导演都给她留点戏份。","天气很冷，陆文川来探班，细心地注意到了众人的情况，便给所有群演安排了加餐的伙食。特地给了顾丽乔不一样的。顾丽乔面对关心从来都是：没关系，我没事。陆文川却会很霸道地准备好一切，如果不用那就不用。这给了顾丽乔安全感。休息的时候，两个人就这样坐在一起。（初次双向的感情）","顾丽乔拍摄淹水的戏，濒死之时，再次看到预言。这次她看到的是自己的死亡，她濒死时看见了陆文川，陆文川很冷静地和下属交代着事情，完全不在意顾丽乔（后会反转）。"]},{"episode":6,"title":"第六集","paragraphs":["顾丽乔在剧组的时候躲避探班的陆文川。陆文川察觉她的疏离，特地等她。周围的人都在议论，顾丽乔说两个人还是保持距离的好。顾丽乔每天收工回酒店，都几近体力边缘，甚至直接困到睡着，直到第二天才醒来，一边刷牙一边背新给的剧本。","闺蜜助理回来的时候总是悄悄给她盖上被子。她也在收到新的演员费用后，立刻给姑妈换了新的店铺，给闺蜜发工资，日子好了起来。","可拍摄过程中，剧组爆出丑闻。有人拍到演员和导演的亲密接触。剧组进入风险事件。而拍摄照片，试图中断拍摄的“神秘人”和前面的神秘人是同一个。（身份保密，仅观众看见）事情爆出来后，许多女演员身陷囹圄。导演抵死不认，表示绝对没有这种事。陆文川找到娱乐新闻的人套话。","顾丽乔参加正常的品牌活动，但因为娱乐新闻，所有人都不敢轻和她有互动。有一张照片爆出，正是顾丽乔开拍前给导演送东西的照片。制片人信以为真，想将她换掉。陆文川以一人之力反对，他信任顾丽乔，也不允许演员在没确认的时候，就毁掉职业生涯。","助理妹妹以为是主演泼脏水，好为自己脱身，因为顾丽乔二人曾见过主演从导演房间出来。可顾丽乔不愿透露，也让助理妹妹不要乱说。这句话正好被主演听到，主演虽然有点看不上顾丽乔，但是对她不泼脏水的行为很有好感。主演告诉顾丽乔，这件事他们管不了，但也不会被波及，等等就好。","次日，消息爆出，是导演和一个小男演员。剧组立刻将导演和男演员换掉。拍摄现场女主演得知这个消息，很是满意，因为那个男演员很爱和演员炒cp，动手动脚。导演也很爱挑起纷争，还喜欢改剧本，偏偏品味低下。","顾丽乔得知陆文川帮了自己，去道谢。陆文川表白自己的心意，顾丽乔心动，却因为预言的内容而有所顾忌。陆文川看出顾丽乔的异常反应，顾丽乔说了真相。陆文川却说给自己一个证明的机会，毕竟她能看到的预言并不完整。","顾丽乔心动，却看见了陆文川的死亡场景，就在之后不久。"]},{"episode":7,"title":"第七集","paragraphs":["陆文川反着去查“导演绯闻”的事件。发现狗仔从未知来源，得知了导演和男演员的事，并被授意故意拍模糊点。陆文川判定那个人的目标很明确，就是针对这个公司，并且极有可能是顾丽乔之前看见的神秘人。","顾丽乔隐瞒了看见陆文川死亡预告的事，并推断出对应的地点和时间是在两天后的拍摄现场（根据剧情或者道具判断）。她让陆文川之后不要来剧组。到了延后了一天以为躲过一劫。结果戏需要重拍，陆文川因为其他缘由来了现场。意外发生，顾丽乔提前救下陆文川。也因此被幕后的神秘人盯上。","陆文川为了保护她直接联系剧组，删除了顾丽乔的戏份。为了保证她的安全，要求她退出剧组。两人发生争吵。顾丽乔不喜欢被做决定，陆文川却也觉得自己是担心顾丽乔。两人不欢而散。"]},{"episode":8,"title":"第八集","paragraphs":["顾丽乔去拍戏，却在回程的时候被人开车暗杀。姑妈收摊子晚，发现异常，为了救她，姑妈被撞身亡。顾丽乔痛哭，绝望，还是救了姑妈。","顾丽乔身体极其虚弱。陆文川看望顾丽乔，这次却没有替她做决定。顾丽乔却说自己确实无法拍摄，拜托他们先把剩余的戏往后安排。至少自己要坚持把戏拍完。必须要在固定时间拍完，这样对大家都好。","闺蜜助理将vlog发出来，陆文川看见了，意外看到了神秘人，和顾丽乔之前说的细节一样。陆文川看出他就是之前动手脚的人，并发现他的身影很熟悉。"]},{"episode":9,"title":"第九集","paragraphs":["现场，顾丽乔的状态引起了担忧。化妆的时候，化妆的人也看出来了顾丽乔过度衰老的异常。这次要拍的还是一场打戏。顾丽乔几乎在体力边缘。她坚持着拍完那出戏，完成得很好，引起众人哗然。","顾丽乔享受这一刻沉浸戏中的感受。心率飙升的时候，她又看见语言。火熊熊燃起，东方庭院燃起大火。眼前的许多群演都在生死边缘，包括主演和伙伴。顾丽乔也看出这个场景，也是顾丽乔自己死亡的场景。","反派展露真身，他就是陈默，陈默和要跳槽的公司联系，说明天就会完成计划。他告知一切，他就是为了钱。","顾丽乔几人共同研究东方庭院的环境和通告单，发现就是今天B组拍摄的戏。"]},{"episode":10,"title":"第十集","paragraphs":["陆文川和顾丽乔二人赶到B组现场，想要取消这场戏，哪怕需要承担高昂的费用。可公司和制片非常不理解，其中陈默也在极力阻止，实则心中非常慌张。现在已经开拍，所有的群演、特约还有设备都已经准备好了，现在更改至少需要一个理由。可陆文川二人根本无法解释。","顾丽乔撒谎说有人要蓄意纵火，她有证据，甚至知道他们要在哪个地方点火。并且现在不知道他是谁，她已经拿到了监控的证据。但现在得先救人。陈默听到这话，假装着急，让大家赶紧救人，疏散人群。","突然，火苗窜起。陆文川和顾丽乔带人疏散。可已经来不及。顾丽乔想起幻觉里看到还有一处地方会着火，那个人就在那里，一旦着火，会更加危险。","跟在身后的陈默听到，悄悄跟着二人，准备趁机杀死顾丽乔。陆文川却突然窜出来将他击倒在地。陈默这才知道自己中计，根本没有证据。","烈火还在燃烧，有人受伤被砸死。顾丽乔看着死去的人，是以前当群演帮过自己的人，她还是选择了救人。救了两三个。她力竭昏倒时，陆文川看到了，惊慌失措地跑来。陆文川的秘书也赶来，陆文川冷静地跟他交代了什么。顾丽乔昏迷过去。","《东方庭院》大获全胜，全剧组接受颁奖。顾丽乔获得最佳女二，但在后台时，顾丽乔和陆文川完全不认识彼此。顾丽乔觉得他眼熟，却完全想不起来。周围的人也说二人全无交集。陆文川离开时，指尖亮起光，原来他也有异能。"]}]}};</script>
<script>
const data=window.PITCH_DATA;
const esc=(value='')=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const query=new URLSearchParams(location.search);
const requestedEpisode=Number(query.get('episode'))||0;
let selectedEpisode=requestedEpisode||Math.max(...data.episodes.map(item=>item.episode));
let selectedVersion='';
const byId=id=>document.getElementById(id);
const pill=(text,accent=false)=>'<span class="pill '+(accent?'accent':'')+'">'+esc(text)+'</span>';
const nameSelectionKey='pitch-name-selections:v2:'+(data.project?.id||data.project?.title||'project');
const worldSelectionKey='pitch-world-selections:v2:'+(data.project?.id||data.project?.title||'project');
let nameSelections={};
let worldSelections={};
try{nameSelections=JSON.parse(localStorage.getItem(nameSelectionKey)||'{}')||{}}catch{nameSelections={}}
try{worldSelections=JSON.parse(localStorage.getItem(worldSelectionKey)||'{}')||{}}catch{worldSelections={}}
function characterSelection(characterName){
  const raw=nameSelections[characterName];
  if(typeof raw==='string')return{mode:'single',single:raw,multiple:[]};
  return{mode:raw?.mode==='multiple'?'multiple':'single',single:raw?.single||'',multiple:Array.isArray(raw?.multiple)?raw.multiple:[]};
}
function saveNameSelections(){try{localStorage.setItem(nameSelectionKey,JSON.stringify(nameSelections))}catch{}}
function setNameSelectionMode(characterName,mode){
  nameSelections[characterName]={...characterSelection(characterName),mode};
  saveNameSelections();renderCharacters();
}
function selectCharacterName(characterName,option){
  const state=characterSelection(characterName);
  if(state.mode==='multiple'){
    state.multiple=state.multiple.includes(option)?state.multiple.filter(name=>name!==option):[...state.multiple,option];
  }else state.single=option;
  nameSelections[characterName]=state;
  saveNameSelections();renderCharacters();
}
function worldGroupSelection(groupLabel){
  const raw=worldSelections[groupLabel];
  if(typeof raw==='string')return{mode:'single',single:raw,multiple:[]};
  return{mode:raw?.mode==='multiple'?'multiple':'single',single:raw?.single||'',multiple:Array.isArray(raw?.multiple)?raw.multiple:[]};
}
function saveWorldSelections(){try{localStorage.setItem(worldSelectionKey,JSON.stringify(worldSelections))}catch{}}
function setWorldSelectionMode(groupLabel,mode){
  worldSelections[groupLabel]={...worldGroupSelection(groupLabel),mode};
  saveWorldSelections();renderNamingContext();
}
function selectWorldName(groupLabel,option){
  const state=worldGroupSelection(groupLabel);
  if(state.mode==='multiple')state.multiple=state.multiple.includes(option)?state.multiple.filter(name=>name!==option):[...state.multiple,option];
  else state.single=option;
  worldSelections[groupLabel]=state;
  saveWorldSelections();renderNamingContext();
}
function renderProject(){
  byId('brand').innerHTML=esc(data.project.title)+'<small>剧本提报 H5</small>';
  byId('projectTitle').textContent=data.project.title;
  byId('logline').textContent=data.project.logline;
  byId('projectMeta').innerHTML=[data.project.format,'更新 '+data.project.updatedAt,data.project.status].map((x,i)=>pill(x,i===2)).join('');
  byId('seasonEngine').textContent=data.project.seasonEngine;
  byId('engineCopy').textContent=data.project.seasonEngine;
  const outline=data.chapters?.storyOutline||data.project.overview||[];
  byId('storyOutline').innerHTML=outline.map(p=>'<p>'+esc(p)+'</p>').join('');
  const guide=data.chapters?.episodeGuide||[];
  byId('episodeGuide').innerHTML=guide.length?guide.map(item=>'<article class="guide-card"><h3>'+esc(item.title)+'</h3>'+(item.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('')+'</article>').join(''):'<div class="empty">待补分集梗概</div>';
  byId('footer').textContent=data.project.title+' · 更新于 '+data.project.updatedAt+' · 本页内容以所列源文件为准';
}
function renderCharacters(){
  const namingRoles=data.naming?.roles||[];
  const rank={女一:0,男一:1,男二:2,女二:3,女三:4};
  const roleFor=name=>namingRoles.find(role=>role.currentName===name);
  const rows=[...(data.characters||[])].sort((a,b)=>(rank[roleFor(a.name)?.billing]??20)-(rank[roleFor(b.name)?.billing]??20));
  byId('characters').innerHTML=rows.length?rows.map(c=>{
    const role=roleFor(c.name);
    const state=characterSelection(c.name);
    const candidates=role?'<div class="candidate-block"><div class="candidate-toolbar"><span class="candidate-label">'+esc(role.billing)+'候选</span><span class="selection-modes" aria-label="姓名选择方式"><button type="button" class="selection-mode" data-character="'+esc(c.name)+'" data-name-mode="single" aria-pressed="'+(state.mode==='single'?'true':'false')+'">○ 单选</button><button type="button" class="selection-mode" data-character="'+esc(c.name)+'" data-name-mode="multiple" aria-pressed="'+(state.mode==='multiple'?'true':'false')+'">☑ 多选</button></span></div><span class="inline-options">'+(role.options||[]).map(name=>{const selected=state.mode==='multiple'?state.multiple.includes(name):state.single===name;return '<button type="button" class="inline-option mode-'+state.mode+'" data-character="'+esc(c.name)+'" data-name-option="'+esc(name)+'" aria-pressed="'+(selected?'true':'false')+'" aria-label="为'+esc(role.billing)+(state.mode==='multiple'?'勾选候选姓名 ':'单选姓名 ')+esc(name)+'">'+esc(name)+'</button>'}).join('')+'</span></div>':'';
    return '<article class="character"><div class="portrait">'+(c.image?'<img src="'+esc(c.image)+'" alt="'+esc(c.name)+' '+esc(c.imageStatus)+'">':'<span>'+esc(c.imageStatus||'待补概念图')+'</span>')+'</div><div class="character-body"><div>'+pill(c.status,true)+' '+pill(c.imageStatus||'待补概念图')+'</div><div class="character-name-row"><h3>'+esc(c.name)+'</h3><span class="current-name-label">现用</span></div>'+candidates+'<p class="character-role">'+esc(c.role)+'</p><p>'+esc(c.bio)+'</p><div class="facts"><div class="fact"><b>外部目标</b><span>'+esc(c.goal||'待确认')+'</span></div><div class="fact"><b>内在需要</b><span>'+esc(c.need||'待确认')+'</span></div><div class="fact"><b>压力 / 秘密</b><span>'+esc(c.pressure||'待确认')+'</span></div><div class="fact"><b>人物弧</b><span>'+esc(c.arc||'待确认')+'</span></div><div class="fact"><b>视觉方向</b><span>'+esc(c.visual||'待确认')+'</span></div></div></div></article>';
  }).join(''):'<div class="empty">待补人物小传</div>';
  byId('characters').querySelectorAll('[data-name-mode]').forEach(button=>button.addEventListener('click',()=>setNameSelectionMode(button.dataset.character,button.dataset.nameMode)));
  byId('characters').querySelectorAll('[data-name-option]').forEach(button=>button.addEventListener('click',()=>selectCharacterName(button.dataset.character,button.dataset.nameOption)));
}
function renderNamingContext(){
  const world=data.worldNaming;
  if(world){
    const researchSources=(world.researchBasis||[]).map(s=>s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.title)+'</a>':esc(s.title)).join(' · ');
    const research=(world.samples||[]).length?'<details class="research-samples"><summary>影视剧世界观命名参考 · '+world.samples.length+'部</summary><div class="sample-list">'+world.samples.map(s=>'<span class="sample-chip">《'+esc(s.title)+'》 '+esc(s.place)+'</span>').join('')+'</div><p class="research-links">只借鉴“现实城市气质＋虚构地名”的构词方式，不直接复用。'+(researchSources?'<br>核验来源：'+researchSources:'')+'</p></details>':'';
    byId('worldNaming').innerHTML='<div class="world-head"><h3>世界观 · 城市与场景命名</h3><p>'+esc(world.note||'')+'</p></div><div class="world-grid">'+(world.groups||[]).map(group=>{const state=worldGroupSelection(group.label);return '<article class="world-card"><div class="candidate-toolbar"><h4>'+esc(group.label)+(group.current?' · 现用 '+esc(group.current):'')+'</h4><span class="selection-modes" aria-label="'+esc(group.label)+'选择方式"><button type="button" class="selection-mode" data-world-group="'+esc(group.label)+'" data-world-mode="single" aria-pressed="'+(state.mode==='single'?'true':'false')+'">○ 单选</button><button type="button" class="selection-mode" data-world-group="'+esc(group.label)+'" data-world-mode="multiple" aria-pressed="'+(state.mode==='multiple'?'true':'false')+'">☑ 多选</button></span></div><div>'+(group.options||[]).map(item=>{const selected=state.mode==='multiple'?state.multiple.includes(item.name):state.single===item.name;return '<button type="button" class="world-option mode-'+state.mode+'" data-world-group="'+esc(group.label)+'" data-world-option="'+esc(item.name)+'" aria-pressed="'+(selected?'true':'false')+'" aria-label="'+esc(group.label)+(state.mode==='multiple'?'勾选 ':'单选 ')+esc(item.name)+'"><span class="world-choice-mark" aria-hidden="true"></span><span><b>'+esc(item.name)+(item.name===group.current?' <span class="current-inline">现用</span>':'')+'</b><small>'+esc(item.archetype)+'｜'+esc(item.rationale)+'</small></span></button>'}).join('')+'</div></article>'}).join('')+'</div>'+research;
    byId('worldNaming').querySelectorAll('[data-world-mode]').forEach(button=>button.addEventListener('click',()=>setWorldSelectionMode(button.dataset.worldGroup,button.dataset.worldMode)));
    byId('worldNaming').querySelectorAll('[data-world-option]').forEach(button=>button.addEventListener('click',()=>selectWorldName(button.dataset.worldGroup,button.dataset.worldOption)));
  }else{byId('worldNaming').hidden=true}
  const naming=data.naming;
  if(!naming?.samples?.length){byId('nameResearch').hidden=true;return}
  const sources=(naming.researchBasis||[]).map(s=>s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.title)+'</a>':esc(s.title)).join(' · ');
  byId('nameResearch').innerHTML='<details class="research-samples" open><summary>命名调研样本 · '+naming.samples.length+'部</summary><div class="sample-list">'+naming.samples.map(s=>'<span class="sample-chip">《'+esc(s.title)+'》 '+esc(s.pair)+'</span>').join('')+'</div><p class="research-links">'+esc(naming.note||'')+(sources?'<br>核验来源：'+sources:'')+'</p></details>';
}
function episodeNumbers(){const values=[...new Set(data.episodes.map(item=>item.episode))].sort((a,b)=>a-b);return requestedEpisode&&values.includes(requestedEpisode)?[requestedEpisode]:values}
function renderNav(){
  byId('episodeNav').innerHTML=episodeNumbers().map(no=>'<button data-episode="'+no+'" class="'+(no===selectedEpisode?'active':'')+'">第'+no+'集</button>').join('');
  byId('episodeNav').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{selectedEpisode=Number(btn.dataset.episode);selectedVersion='';renderNav();renderVersions();renderEpisodes()}));
}
function renderVersions(){
  const versions=data.episodes.filter(item=>item.episode===selectedEpisode).sort((a,b)=>b.version.localeCompare(a.version,undefined,{numeric:true}));
  if(!selectedVersion)selectedVersion=versions[0]?.version||'';
  byId('versionSelect').innerHTML=versions.map(item=>'<option value="'+esc(item.version)+'" '+(item.version===selectedVersion?'selected':'')+'>'+esc(item.version)+' · '+esc(item.intakeDate)+'</option>').join('');
  byId('versionSelect').onchange=e=>{selectedVersion=e.target.value;renderEpisodes()};
}
function renderEpisode(item){
  const issues=item.issues||[];
  const continuity=item.continuity||[];
  return '<article class="episode-section active"><header class="episode-head"><div class="episode-title-row"><div><p class="kicker">EPISODE '+String(item.episode).padStart(2,'0')+' · '+esc(item.version)+'</p><h3>第'+item.episode+'集 · '+esc(item.title)+'</h3></div><div>'+pill(item.duration)+' '+pill(item.status,true)+'</div></div><p class="episode-core">'+esc(item.core)+'</p><div class="beat-grid"><div class="beat"><b>开场钩子</b>'+esc(item.hook)+'</div><div class="beat"><b>人物转折</b>'+esc(item.turn)+'</div><div class="beat"><b>集尾钩子</b>'+esc(item.endingHook)+'</div></div><p class="scene-meta">来源：'+esc(item.sourceFile)+' · '+esc(item.updateSummary)+'</p></header><div class="scenes">'+item.scenes.map(scene=>'<article class="scene"><div class="scene-top"><div class="scene-no">'+String(scene.displaySceneNo).padStart(2,'0')+'</div><div><h4>'+esc(scene.heading)+'</h4><p class="scene-meta">原场号 '+esc(scene.sourceSceneNo)+' · '+esc((scene.characters||[]).join('、'))+'</p></div></div><p class="scene-summary">'+esc(scene.summary)+'</p><div class="script">'+esc(scene.script)+'</div></article>').join('')+'</div><section class="section"><div class="section-head"><h2>连续性与待确认</h2><p class="section-intro">不把整理判断冒充剧本事实。</p></div><div class="issues">'+continuity.map(x=>'<div class="issue"><b>连续性</b> · '+esc(x)+'</div>').join('')+issues.map(x=>'<div class="issue"><b>待确认</b> · '+esc(x)+'</div>').join('')+(continuity.length||issues.length?'':'<div class="empty">本版未记录待确认项</div>')+'</div></section></article>';
}
function renderEpisodes(){
  const versions=data.episodes.filter(item=>item.episode===selectedEpisode);
  const item=versions.find(row=>row.version===selectedVersion)||versions.sort((a,b)=>b.version.localeCompare(a.version,undefined,{numeric:true}))[0];
  byId('episodes').innerHTML=item?renderEpisode(item):'<div class="empty">该集暂无内容</div>';
  document.title=data.project.title+' 第'+selectedEpisode+'集 '+(item?.version||'')+' 剧本提报';
}
function renderSources(){
  byId('sources').innerHTML=(data.sources||[]).map(s=>'<div class="source"><div><b>'+esc(s.fileName)+'</b><div class="scene-meta">'+esc(s.kind)+' · '+esc(s.note||'')+'</div></div>'+pill((s.version||'v1')+' · '+s.intakeDate)+'</div>').join('');
}
byId('downloadButton').addEventListener('click',()=>{
  const item=data.episodes.find(row=>row.episode===selectedEpisode&&row.version===selectedVersion);
  document.title=data.project.title+'_第'+selectedEpisode+'集_'+(item?.version||'v1')+'_剧本提报';
  window.print();
});
byId('copyButton').addEventListener('click',async()=>{
  const url=new URL(location.href);url.searchParams.set('episode',String(selectedEpisode));url.searchParams.delete('print');
  try{await navigator.clipboard.writeText(url.toString());byId('copyButton').textContent='已复制 H5 链接';setTimeout(()=>byId('copyButton').textContent='复制本集 H5',1600)}catch{prompt('复制本集 H5 链接',url.toString())}
});
async function syncPublishedEpisodes(){
  if(location.protocol==='file:')return;
  try{
    const response=await fetch('/api/public/episodes',{cache:'no-store'});
    if(!response.ok)return;
    const payload=await response.json();
    for(const item of payload.episodes||[]){
      const key=item.episode+'::'+item.version;
      if(!data.episodes.some(row=>row.episode+'::'+row.version===key))data.episodes.push(item);
    }
    const available=episodeNumbers();selectedEpisode=requestedEpisode&&available.includes(requestedEpisode)?requestedEpisode:Math.max(...data.episodes.map(item=>item.episode));selectedVersion='';renderNav();renderVersions();renderEpisodes();
    if(query.get('print')==='1')setTimeout(()=>window.print(),350);
  }catch{}
}
renderProject();renderCharacters();renderNamingContext();renderNav();renderVersions();renderEpisodes();renderSources();syncPublishedEpisodes();
</script>
</body>
</html>
